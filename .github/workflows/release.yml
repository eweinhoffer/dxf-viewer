name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            DXF Viewer ${{ github.ref_name }}

            - Adds GitHub artifact attestations for release assets.
            - Fixes Obsidian popout-window compatibility warning.
            - No user-facing behavior changes.
          files: |
            main.js
            manifest.json
            styles.css
